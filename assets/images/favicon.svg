<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="highlightGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#f59e0b" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Arka Plan Yuvarlak Kare -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <rect x="16" y="16" width="480" height="480" rx="96" fill="none" stroke="url(#goldGrad)" stroke-width="8" stroke-opacity="0.25"/>

  <!-- Vinç Kulesi ve Bum Geometrisi -->
  <g filter="url(#glow)">
    <!-- Çapraz Taşıyıcı Bum (Jib) -->
    <path d="M 120 170 L 380 90 L 400 120 L 140 200 Z" fill="url(#highlightGrad)"/>
    
    <!-- Ana Taşıyıcı Kule Gövdesi -->
    <path d="M 170 170 L 220 155 L 250 410 L 190 410 Z" fill="url(#goldGrad)"/>

    <!-- Kafes Çapraz Destek Çizgileri -->
    <line x1="180" y1="210" x2="235" y2="250" stroke="#0f172a" stroke-width="6" stroke-linecap="round"/>
    <line x1="235" y1="250" x2="195" y2="300" stroke="#0f172a" stroke-width="6" stroke-linecap="round"/>
    <line x1="195" y1="300" x2="245" y2="350" stroke="#0f172a" stroke-width="6" stroke-linecap="round"/>
    <line x1="245" y1="350" x2="205" y2="400" stroke="#0f172a" stroke-width="6" stroke-linecap="round"/>

    <!-- Kabin / Döndürücü -->
    <rect x="160" y="150" width="55" height="40" rx="6" fill="#38bdf8"/>
    <rect x="165" y="155" width="22" height="30" rx="3" fill="#e0f2fe" opacity="0.8"/>

    <!-- Çelik Halat Kablosu -->
    <line x1="360" y1="100" x2="360" y2="290" stroke="#94a3b8" stroke-width="4" stroke-dasharray="8 4"/>

    <!-- Vinç Kaldırma Kancası (Hook) -->
    <g transform="translate(360, 290)">
      <!-- Kanca Makarası (Pulley block) -->
      <rect x="-18" y="0" width="36" height="30" rx="6" fill="url(#goldGrad)" stroke="#0f172a" stroke-width="3"/>
      <circle cx="0" cy="15" r="7" fill="#0f172a"/>
      
      <!-- Kanca Eğrisi -->
      <path d="M 0 30 C 0 45, -16 52, -16 68 C -16 82, -2 94, 14 94 C 30 94, 38 80, 36 68 C 34 58, 22 58, 22 66 C 22 72, 18 78, 12 78 C 4 78, 0 72, 0 66 C 0 54, 14 46, 14 36 Z" fill="url(#highlightGrad)"/>
    </g>

    <!-- Zemin Platformu / Tekerlekli Palet Tabanı -->
    <rect x="140" y="405" width="140" height="25" rx="6" fill="#475569"/>
    <circle cx="165" cy="418" r="7" fill="#0f172a"/>
    <circle cx="195" cy="418" r="7" fill="#0f172a"/>
    <circle cx="225" cy="418" r="7" fill="#0f172a"/>
    <circle cx="255" cy="418" r="7" fill="#0f172a"/>
  </g>

  <!-- Marka İnisiyali 'T' Rozeti -->
  <g transform="translate(70, 70)">
    <circle cx="28" cy="28" r="28" fill="#f59e0b"/>
    <text x="28" y="38" font-family="'Inter', -apple-system, sans-serif" font-weight="900" font-size="30" fill="#0f172a" text-anchor="middle">T</text>
  </g>
</svg>
